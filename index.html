<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: dweis-next-resource:; media-src 'self' dweis-next-resource: blob:; font-src 'self' data:; connect-src 'self' dweis-next-resource: https: wss: ws:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <link rel="icon" href="./favicon.ico" />
    <title>%APP_NAME%</title>
    <script>
      // Resolve theme before first paint so the window shows the correct background the moment it
      // appears, avoiding a white/wrong-color flash while React/Tailwind are still loading. Reads the
      // same persisted key as ThemeProvider (%DWEIS_THEME_KEY% is injected from branding at build time
      // per R1), falling back to the system theme. Any failure is ignored (worst case: light background).
      ;(function () {
        try {
          // 品牌重命名迁移回退：老版本存的是 wanta.theme，读新 key 无值时回退旧 key（迁移脚本会在
          // 渲染层启动时把旧 key 复制到新 key，此处首帧兼容迁移前的一次启动）。
          var pref = localStorage.getItem("%DWEIS_THEME_KEY%")
          if (pref === null) {
            pref = localStorage.getItem("wanta.theme")
          }
          // 主题色板：首帧提前挂 data-palette，避免 React 加载前闪默认色。
          var palette = localStorage.getItem("%DWEIS_THEME_PALETTE_KEY%")
          if (palette === "sunset" || palette === "forest") {
            document.documentElement.dataset.palette = palette
          }
          var dark =
            pref === "dark" ||
            ((pref === "system" || !pref) && window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) {
            document.documentElement.classList.add("dark")
          }
        } catch (e) {}
      })()
    </script>
    <style>
      /* Critical first-paint styles: applied before Tailwind / React load so the window is never blank
         white. Background colors mirror index.css --background (light / .dark) for a seamless handoff
         once React takes over. */
      html {
        background: oklch(1 0 0);
        color: oklch(0.241 0.01 249);
        color-scheme: light;
      }
      html.dark {
        background: oklch(0.179 0.004 286);
        color: oklch(0.949 0.003 268);
        color-scheme: dark;
      }
      /* React clears #root on mount, removing the boot placeholder below (it only covers the gap
         before the JS bundle loads). */
      #dweis-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #dweis-boot::after {
        content: "";
        width: 22px;
        height: 22px;
        border-radius: 9999px;
        border: 2px solid color-mix(in oklch, currentColor 18%, transparent);
        border-top-color: currentColor;
        animation: dweis-boot-spin 0.7s linear infinite;
        opacity: 0.55;
      }
      @keyframes dweis-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="dweis-boot" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
